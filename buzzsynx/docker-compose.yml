services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buzzsynx-app
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17-alpine
    container_name: buzzsynx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: buzzsynx
      POSTGRES_PASSWORD: buzzsynx
      POSTGRES_DB: buzzsynx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: buzzsynx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: